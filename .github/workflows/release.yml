name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: android-web
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          
          # Chạy lệnh đóng gói Inno Setup
          iscc windows/installer.iss
          
          # Tự động tìm file .exe đầu ra trong thư mục hiện tại hoặc thư mục con
          $GeneratedFile = Get-ChildItem -Recurse -Filter *.exe | Where-Object { $_.FullName -notlike "*\build\*" -and $_.FullName -notlike "*\.github\*" } | Select-Object -First 1
          
          if ($GeneratedFile) {
              Write-Host "Tìm thấy file installer được tạo ra: $($GeneratedFile.FullName)"
              # Đổi tên và đưa file về thư mục gốc để bước Upload Artifacts tìm thấy
              Move-Item -Path $GeneratedFile.FullName -Destination "lan-secure-messenger-windows-setup.exe" -Force
              Write-Host "Đã chuẩn bị file lan-secure-messenger-windows-setup.exe thành công."
          } else {
              throw 'LỖI: Không tìm thấy bất kỳ file installer (.exe) nào được tạo ra từ Inno Setup!'
          }

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Package macOS
        if: matrix.target == 'macos'
        run: hdiutil create -volname "Lan Secure Messenger" -srcfolder build/macos/Build/Products/Release/lan_secure_messenger.app -ov -format UDZO lan-secure-messenger-macos.dmg

      - name: Build Android and Web
        if: matrix.target == 'android-web'
        run: |
          flutter build apk --release
          flutter build web --release --base-href /web/ --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk lan-secure-messenger-android.apk
          cd build/web && zip -r ../../lan-secure-messenger-web.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            lan-secure-messenger-windows-setup.exe
            lan-secure-messenger-macos.dmg
            lan-secure-messenger-android.apk
            lan-secure-messenger-web.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
