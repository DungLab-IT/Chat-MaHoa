name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: android-web
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName 'lan_secure_messenger.exe') } |
            Select-Object -First 1
          if (-not $releaseDir) { throw 'Flutter Windows release directory was not found' }
          Copy-Item (Join-Path $releaseDir.FullName 'lan_secure_messenger.exe') lan-secure-messenger-windows.exe
          Compress-Archive -Path (Join-Path $releaseDir.FullName '*') -DestinationPath lan-secure-messenger-windows.zip

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Package macOS
        if: matrix.target == 'macos'
        run: hdiutil create -volname "Lan Secure Messenger" -srcfolder build/macos/Build/Products/Release/lan_secure_messenger.app -ov -format UDZO lan-secure-messenger-macos.dmg

      - name: Build Android and Web
        if: matrix.target == 'android-web'
        run: |
          flutter build apk --release
          flutter build web --release --base-href /web/ --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk lan-secure-messenger-android.apk
          cd build/web && zip -r ../../lan-secure-messenger-web.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            lan-secure-messenger-windows.zip
            lan-secure-messenger-windows.exe
            lan-secure-messenger-macos.dmg
            lan-secure-messenger-android.apk
            lan-secure-messenger-web.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*