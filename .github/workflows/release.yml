name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build Android and Web
        run: |
          flutter build apk --release
          flutter build web --release --base-href /web/ --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk lan-secure-messenger-android.apk
          cd build/web
          zip -r ../../lan-secure-messenger-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-web
          path: |
            lan-secure-messenger-android.apk
            lan-secure-messenger-web.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows installer
        shell: pwsh
        run: |
          iscc /O. windows/installer.iss
          if (-not (Test-Path lan-secure-messenger-windows-setup.exe)) {
            throw 'Windows installer was not created'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: lan-secure-messenger-windows-setup.exe

  publish:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/lan-secure-messenger-android.apk
            release-assets/lan-secure-messenger-windows-setup.exe
            release-assets/lan-secure-messenger-web.zip
